    row.garantias=pUno(f.garantias);row.servicios=pDos(f.servicios);row.rutas=pRut(f.rutas);row.pasos=pDos(f.pasos);row.faq=pDos(f.faq);row.ubicaciones=pDos(f.ubicaciones);
    if(!row.nombre)return msg('El nombre de la agencia es obligatorio.');
    if(dueno){row.slug=slugify(f.slug);row.activa=!!f.activa;
      if(row.slug.length<3)return msg('La dirección debe tener al menos 3 letras o números.');
      if(RESERV.includes(row.slug))return msg('Esa dirección está reservada. Elige otra.')}
    const id=nueva?null:+fm.dataset.id;
    const{data,error}=nueva?await db.from('agencias').insert(row).select():await db.from('agencias').update(row).eq('id',id).select();
    if(error){msg(error.code==='23505'?'Esa dirección ya la usa otra agencia. Elige otra.':error.code==='23514'?'La dirección no es válida o está reservada. Elige otra.':/column|schema/i.test(error.message)?'Falta ejecutar migracion-agencias-dinamicas.sql y migracion-multiagencia.sql en Supabase.':'No se pudo guardar: '+error.message);return}
    if(!data.length)return msg('No se guardó: tu cuenta no tiene permiso para editar esta agencia.');
    await load();
    if(nueva){agSel=data[0].id;S.acc=[];render();$('#cm').textContent='Agencia creada ✓ Su página: https://carga.pe/'+row.slug+'. Ahora dale acceso con su correo (más abajo).'}
    else{render();$('#cm').textContent='Cambios guardados ✓'}}
  if(e.target.id==='sf'){e.preventDefault();const q=$('#sq').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!q){$('#se').textContent='Ingresa tu código de seguimiento.';return}location.hash='seg-'+q}
  if(e.target.id==='lf'){e.preventDefault();const f=new FormData(e.target);const{data,error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('pw')});if(error){$('#le').textContent='Correo o contraseña incorrectos.';return}user=data.user;await load();render()}
});
